[project]
name = "custom-gpt-6m"
version = "0.1.0"
description = "A ~5.85M-parameter GPT-style model, trained from scratch on TinyStories — causal-LM, masked-LM, and contrastive objectives, plus DDP/FSDP mechanism demos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "huggingface_hub>=0.23",
    "python-dotenv>=1.0",
]

[project.scripts]
gpt-config = "gpt.cli.show_config:main"
gpt-data = "gpt.cli.prepare_data:main"
gpt-replay-mix = "gpt.cli.replay_mix:main"
gpt-train = "gpt.cli.train:main"
gpt-train-mlm = "gpt.cli.train_mlm:main"
gpt-train-contrastive = "gpt.cli.train_contrastive:main"
gpt-train-ddp = "gpt.cli.train_ddp:main"
gpt-train-fsdp = "gpt.cli.train_fsdp:main"
gpt-infer = "gpt.cli.infer:main"
gpt-serve = "gpt.cli.serve:main"
gpt-test = "gpt.cli.test_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt"]
