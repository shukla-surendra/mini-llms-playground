[project]
name = "custom-gpt-350m"
version = "0.1.0"
description = "From-scratch GPT with a config-driven model size — train, evaluate, and serve."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "datasets>=2.19",
    "tqdm>=4.66",
    "tokenizers>=0.20",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# GPT_OPTIMIZER=adamw8bit (trainer.py) — CUDA/CPU only, no MPS kernel. Kept out of the
# base install so a plain MPS/CPU checkout doesn't pull a package it can't use on GPU.
8bit = ["bitsandbytes>=0.43"]
# The export is portable: it only needs Hugging Face serialization dependencies.
# vLLM itself is constrained to Linux here because its PyPI package resolves CUDA
# dependencies that do not exist for macOS/Apple Silicon.
hf-export = [
    "transformers>=4.46,<6",
    "safetensors>=0.4",
]
vllm = [
    "transformers>=4.46,<6",
    "safetensors>=0.4",
    "vllm>=0.11; sys_platform == 'linux'",
]

[project.scripts]
gpt-config = "gpt.cli.show_config:main"
gpt-data = "gpt.cli.prepare_data:main"
gpt-train-tokenizer = "gpt.cli.train_tokenizer:main"
gpt-tokenize = "gpt.cli.tokenize_corpus:main"
gpt-benchmark = "gpt.cli.benchmark:main"
gpt-audit = "gpt.cli.audit_data:main"
gpt-train = "gpt.cli.train:main"
gpt-infer = "gpt.cli.infer:main"
gpt-serve = "gpt.cli.serve:main"
gpt-eval = "gpt.cli.evaluate:main"
gpt-qa-report = "gpt.cli.qa_report:main"
gpt-export-vllm = "gpt.cli.export_vllm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt"]
