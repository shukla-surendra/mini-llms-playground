[project]
name = "custom-gpt-word"
version = "0.1.0"
description = "A small, heavily commented word-level GPT for learning Transformer training and generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.scripts]
word-gpt-config = "wordgpt.show_config:main"
word-gpt-dry-run = "wordgpt.dry_run:main"
word-gpt-train = "wordgpt.train:main"
word-gpt-generate = "wordgpt.generate:main"
word-gpt-eval = "wordgpt.evaluate:main"
word-gpt-distill = "wordgpt.distill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordgpt"]
