[project]
name = "custom-gpt-distill-10m"
version = "0.1.0"
description = "A from-scratch ~10M-param GPT trained entirely on sequence-level distillation from a local Ollama teacher."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "transformers>=4.40",
]

[project.scripts]
gpt-config = "gpt.cli.show_config:main"
gpt-distill = "gpt.cli.distill:main"
gpt-train = "gpt.cli.train:main"
gpt-train-soft = "gpt.cli.train_soft:main"
gpt-infer = "gpt.cli.infer:main"
gpt-eval = "gpt.cli.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt"]
