[project]
name = "custom-gpt-nano"
version = "0.1.0"
description = "A <1M-parameter, deliberately minimal GPT trained from scratch — one bundled toy corpus, character-level tokenizer, hand-written attention, heavily commented — for learning the mechanism, not the other five projects' production concerns (DDP/FSDP, serving, resumable multi-day runs)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[project.scripts]
nano-config = "nanogpt.show_config:main"
nano-train = "nanogpt.train:main"
nano-generate = "nanogpt.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanogpt"]
