[project]
name = "tinystories-gpt-6m"
version = "0.1.0"
description = "A ~5.85M-parameter GPT-style model, trained from scratch on TinyStories"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "huggingface_hub>=0.23",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
